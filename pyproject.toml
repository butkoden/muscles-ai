[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscles-ai"
version = "0.1.0"
description = "Framework-level AI and RAG primitives for Muscles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Denis B.", email = "denis@butko.info" }]
dependencies = [
  "muscles>=1.0.0rc1,<2.0.0",
  "pydantic>=2.7,<3.0",
]

[project.urls]
Homepage = "https://github.com/butkoden/muscles-ai"
Repository = "https://github.com/butkoden/muscles-ai"
Documentation = "https://github.com/butkoden/muscles-ai#readme"
PyPI = "https://pypi.org/project/muscles-ai/"
Releases = "https://github.com/butkoden/muscles-ai/releases"
"muscles" = "https://pypi.org/project/muscles/"
"muscles-documents" = "https://pypi.org/project/muscles-documents/"
"muscles-data" = "https://pypi.org/project/muscles-data/"
"muscles-mcp" = "https://pypi.org/project/muscles-mcp/"
"muscles-sse" = "https://pypi.org/project/muscles-sse/"
"muscles-benchmarks" = "https://pypi.org/project/muscles-benchmarks/"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
openai = [
  "openai>=1.0,<2.0",
]
llama-cpp = [
  "llama-cpp-python>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
